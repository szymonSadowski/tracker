<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    The T mark. The two stops duplicate --brand-from / --brand-to from app/globals.css, which is
    their source of truth: an SVG served as a file cannot read the stylesheet's custom properties
    (design.md D5). Change both places together.

    userSpaceOnUse keeps one gradient running across both bars rather than restarting per shape.
    The bars are deliberately heavy — a thin stem disappears at 16px.
  -->
  <defs>
    <linearGradient id="brand" x1="4" y1="4" x2="28" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2f5d50" />
      <stop offset="1" stop-color="#37806a" />
    </linearGradient>
  </defs>
  <!-- A light plate, so the mark holds its shape against dark browser chrome as well as light. -->
  <rect width="32" height="32" rx="7" fill="#fbfbfa" />
  <g fill="url(#brand)">
    <rect x="5" y="7" width="22" height="6" rx="1.5" />
    <rect x="12.5" y="7" width="7" height="18" rx="1.5" />
  </g>
</svg>
